<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tester Lab logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a72e6"/>
      <stop offset="1" stop-color="#1350bd"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- Monogram TL, drawn as clean geometric strokes -->
  <g fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="square" stroke-linejoin="miter">
    <!-- T: top bar and stem, aligned top 160 to bottom 352 -->
    <path d="M116 160 H272"/>
    <path d="M194 160 V352"/>
    <!-- L: aligned to the same top and bottom as T -->
    <path d="M316 160 V352 H404"/>
  </g>
</svg>
