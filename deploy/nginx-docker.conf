# nginx config for the Docker Compose setup.
# Unlike deploy/nginx-*.conf.example (which proxy to 127.0.0.1:3000 on a VM),
# this proxies to the "app" service by its Compose network name.
#
# SSL is intentionally omitted here: terminate TLS at a host-level reverse proxy
# or add a certbot/Traefik container. For local/testing this serves plain HTTP.

server {
    listen 80;
    server_name _;

    # Large enough for feedback attachments sent as base64 inside JSON bodies
    # (a 5 MB image becomes ~6.7 MB after base64). Without this, 413 errors.
    client_max_body_size 20m;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Recorder proxy streams target pages + NDJSON run progress; disable
        # buffering so lines/bytes flow through promptly.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
